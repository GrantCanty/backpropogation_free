[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "no-backprop"
version = "0.1.0"
description = "Experiments in bounded-memory online learning without backpropagation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
baseline = ["torch>=2.0"]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7", "psutil>=5"]

[project.scripts]
no-backprop = "no_backprop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
